[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datahenge-cairn"
version = "0.4.9"
description = "Reproducible ERPNext image builds and pull-based deploys on a single VPS, from an owned Docker build recipe."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Pond", email = "brian@datahenge.com" }]
keywords = ["erpnext", "frappe", "docker", "deployment", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Datahenge/cairn"
Repository = "https://github.com/Datahenge/cairn"
Issues = "https://github.com/Datahenge/cairn/issues"
Changelog = "https://github.com/Datahenge/cairn/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=6.0",
]
docs = [
  "mkdocs-material>=9.5",
]

# Three entry points, one package (ADR-046, ADR-048): cairn-build (build/control), cairn-adopt
# (target), cairn-registry (registry host) — no unified `cairn` command, no `cairn-provision`.
# Each carries its own `setup` subcommand, privilege-gated, replacing the old separate
# installer (BR-CLI-021).
[project.scripts]
cairn-build = "cairn.cli_build:main"
cairn-adopt = "cairn.cli_adopt:main"
cairn-registry = "cairn.cli_registry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The owned recipe tree (src/cairn/recipe/, ADR-059) is a Docker build recipe — Containerfile
# and shell, not Python — so it is not linted to this project's Python standard.
extend-exclude = ["src/cairn/recipe"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
