[project]
name = "docker-cairn"
version = "0.0.0"
description = "Wrapper around frappe_docker for reproducible ERPNext image builds, pull-based deploys, and DB backup/restore/rollback on a single VPS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brian Pond", email = "brian@datahenge.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["ventwig>=0.2,<0.3"]

# --- Vendoring (ventwig) ---------------------------------------------------
# frappe_docker is vendored read-only as plain committed files. We never edit it
# (D-001). The committed tree + .ventwig.lock (synced commit + content-tree hash)
# are the immutability anchor; `ref` tracks an upstream *release tag* so re-syncs
# are deterministic and upgrades are deliberate (D-007).
[tool.ventwig]
# We vendor the whole frappe_docker repo root, not a Python src/ subdir, so we do
# NOT want __init__.py markers injected into the Docker build context.
create_parent_package_markers = false

[[tool.ventwig.sources]]
name = "frappe_docker"
local_path = "frappe_docker"
upstream = "https://github.com/frappe/frappe_docker.git"
ref = "v3.2.1"
