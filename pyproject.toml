[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datahenge-cairn"
version = "0.4.12"
description = "Reproducible ERPNext image builds and pull-based deploys on a single VPS, from an owned Docker build recipe."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Pond", email = "brian@datahenge.com" }]
keywords = ["erpnext", "frappe", "docker", "deployment", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Datahenge/cairn"
Repository = "https://github.com/Datahenge/cairn"
Issues = "https://github.com/Datahenge/cairn/issues"
Changelog = "https://github.com/Datahenge/cairn/blob/version-16/docs/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=6.0",
]
docs = [
  "mkdocs-material>=9.5",
]

# Three entry points, one package (ADR-046, ADR-048): cairn-build (build/control), cairn-adopt
# (target), cairn-registry (registry host) — no unified `cairn` command, no `cairn-provision`.
# Each carries its own `setup` subcommand, privilege-gated, replacing the old separate
# installer (BR-CLI-021).
[project.scripts]
cairn-build = "cairn.cli_build:main"
cairn-adopt = "cairn.cli_adopt:main"
cairn-registry = "cairn.cli_registry:main"

# `python -m build` resolves the backend in an isolated environment, so the hatchling that
# builds a release is whatever PyPI serves that day — not the one pinned in a local venv.
# hatchling 1.32.0 moved its default core-metadata version to 2.5, which twine 6.2.0 rejects:
# twine monkeypatches packaging's `_VALID_METADATA_VERSIONS` (to re-add 2.0) with a hardcoded
# list ending at 2.4, so a newer `packaging` cannot fix it. Fixed upstream in twine 7.0.0, which
# drops the monkeypatch and requires packaging>=26.1 — so this pin is no longer strictly needed
# once every machine that publishes cairn is on twine >= 7. Kept regardless: it makes a
# release's metadata version a property of this repo rather than of whichever hatchling the
# isolated build environment fetched that morning. Safe to raise to 2.5, or drop, deliberately.
[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The owned recipe tree (src/cairn/recipe/, ADR-059) is a Docker build recipe — Containerfile
# and shell, not Python — so it is not linted to this project's Python standard.
extend-exclude = ["src/cairn/recipe"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
