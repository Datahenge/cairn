[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datahenge-cairn"
version = "0.3.0"
description = "Wrapper around frappe_docker for reproducible ERPNext image builds and pull-based deploys on a single VPS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Pond", email = "brian@datahenge.com" }]
keywords = ["erpnext", "frappe", "docker", "deployment", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Datahenge/cairn"
Repository = "https://github.com/Datahenge/cairn"
Issues = "https://github.com/Datahenge/cairn/issues"
Changelog = "https://github.com/Datahenge/cairn/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "ventwig>=0.2,<0.3",
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=6.0",
]
docs = [
  "mkdocs-material>=9.5",
]

# Three entry points, one package (ADR-046, ADR-048): cairn-build (build/control), cairn-adopt
# (target), cairn-registry (registry host) — no unified `cairn` command, no `cairn-provision`.
# Each carries its own `setup` subcommand, privilege-gated, replacing the old separate
# installer (BR-CLI-021).
[project.scripts]
cairn-build = "cairn.cli_build:main"
cairn-adopt = "cairn.cli_adopt:main"
cairn-registry = "cairn.cli_registry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

# --- Vendoring (ventwig) ---------------------------------------------------
# frappe_docker is vendored read-only as plain committed files, living inside the cairn
# package itself (src/cairn/vendored/) so it ships in the wheel like any other package
# data — no special packaging step. We never edit it (ADR-001). `ref` tracks an upstream
# *release tag* so re-syncs are deterministic and upgrades are deliberate (ADR-007).
# ventwig is a dev-only tool: it runs solely inside `cairn-build vendor sync`, to fetch a new
# pin from upstream. cairn never invokes it at build time — the immutability anchor for
# a build is src/cairn/vendored/frappe_docker.pin.toml, generated by `sync` and read
# package-relatively, so it works identically in a checkout and in an installed wheel.
[tool.ventwig]
create_parent_package_markers = false

[[tool.ventwig.sources]]
name = "frappe_docker"
local_path = "src/cairn/vendored/frappe_docker"
upstream = "https://github.com/frappe/frappe_docker.git"
ref = "v3.2.1"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The vendored tree is upstream code we never edit (ADR-001) — linting it would flag
# issues we have no intention of fixing and cannot fix without violating BR-VEND-004.
extend-exclude = ["src/cairn/vendored/frappe_docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
