[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datahenge-cairn"
version = "0.0.0"
description = "Wrapper around frappe_docker for reproducible ERPNext image builds and pull-based deploys on a single VPS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brian Pond", email = "brian@datahenge.com" }]
dependencies = [
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "ventwig>=0.2,<0.3",
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
]

# `cairn` is the command; `datahenge-cairn` is an alias fallback (ADR-018).
[project.scripts]
cairn = "cairn.cli:run"
datahenge-cairn = "cairn.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

# --- Vendoring (ventwig) ---------------------------------------------------
# frappe_docker is vendored read-only as plain committed files. We never edit it
# (ADR-001). The committed tree + .ventwig.lock (synced commit + content-tree hash)
# are the immutability anchor; `ref` tracks an upstream *release tag* so re-syncs
# are deterministic and upgrades are deliberate (ADR-007).
[tool.ventwig]
create_parent_package_markers = false

[[tool.ventwig.sources]]
name = "frappe_docker"
local_path = "frappe_docker"
upstream = "https://github.com/frappe/frappe_docker.git"
ref = "v3.2.1"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `install/bootstrap.py` is not part of the wheel — it runs before cairn is installed and
# imports nothing from it (ADR-040). Putting it on the path lets the suite import and test it
# anyway, which matters because it runs as root on client machines (BR-DEPLOY-021).
pythonpath = ["install"]
